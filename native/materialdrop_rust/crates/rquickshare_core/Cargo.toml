[package]
name = "rquickshare_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Rust cross-platform Quick Share protocol core (mDNS, UKEY2, SecureMessage, file transfer) without Tauri dependencies"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
get_if_addrs = "0.5"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4"
mdns-sd = "0.22"
num-bigint = "0.4"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
