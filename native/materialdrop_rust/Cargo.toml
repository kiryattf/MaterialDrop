[workspace]
members = [
    ".",
    "crates/rquickshare_core",
]
resolver = "2"

[package]
name = "materialdrop_rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native QUIC P2P (iroh) and cross-platform Quick Share FFI engine for MaterialDrop"

[lib]
name = "materialdrop_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
iroh = "1.5"
iroh-tickets = "1.0"
once_cell = "1.20"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
urlencoding = "2.1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
rquickshare_core = { path = "crates/rquickshare_core" }

# Lightweight dev profile (no LTO, low opt-level to avoid excessive RAM/disk usage)
[profile.dev]
opt-level = 1
lto = false
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
