name: Build & Release MaterialDrop

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/materialdrop_rust

      - run: cargo test --manifest-path native/materialdrop_rust/Cargo.toml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/materialdrop_rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Rust Android FFI libraries
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            if [ -d "$SDK_ROOT/ndk" ]; then
              NDK_DIR="$(find "$SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1 || true)"
            fi
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
            { yes || true; } | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "ndk;27.0.12077973"
            NDK_DIR="$SDK_ROOT/ndk/27.0.12077973"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          mkdir -p android/app/src/main/jniLibs
          cd native/materialdrop_rust
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86_64 -P 26 -o ../../android/app/src/main/jniLibs build --release

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MaterialDrop-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/materialdrop_rust

      - run: cargo build --manifest-path native/materialdrop_rust/Cargo.toml --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release_out\MaterialDrop-Windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MaterialDrop-Windows-x64
          path: release_out/MaterialDrop-Windows-x64.zip
          if-no-files-found: error

  build_linux:
    name: Build Linux x64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK3 & GStreamer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev liblzma-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/materialdrop_rust

      - run: cargo build --manifest-path native/materialdrop_rust/Cargo.toml --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Archive Linux release bundle
        run: |
          mkdir -p release_out
          tar -czf release_out/MaterialDrop-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: MaterialDrop-Linux-x64
          path: release_out/MaterialDrop-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_android, build_windows, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MaterialDrop-Android-APK/app-release.apk
            artifacts/MaterialDrop-Windows-x64/MaterialDrop-Windows-x64.zip
            artifacts/MaterialDrop-Linux-x64/MaterialDrop-Linux-x64.tar.gz
