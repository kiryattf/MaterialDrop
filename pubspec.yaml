name: material_drop
description: "MaterialDrop — Cross-platform P2P file sharing (MaterialDrop Direct + Google Quick Share) with native Material Design 3 Expressive UI."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  dynamic_color: ^2.0.0
  shared_preferences: ^2.3.0
  file_picker: ^8.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  mime: ^2.0.0
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  audioplayers: ^6.1.0
  desktop_drop: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
